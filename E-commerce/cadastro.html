<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Cadastro</title>
</head>

<body>

    <div class="IconController"></div>

    <h1>Seja Bem-vindo!</h1>

    <form class="cadastro-container">

        <h2>Criar conta</h2>

        <div class="input-container">
            <i data-lucide="user" class="input-icon"></i>
            <input id="name" type="text" placeholder="Nome" required>
        </div>

        <div class="input-container">
            <i data-lucide="user-round" class="input-icon"></i>
            <input id="username" type="text" placeholder="Nome de usuário" required>
        </div>

        <div class="input-container">
            <i data-lucide="mail" class="input-icon"></i>
            <input id="email" type="email" placeholder="Email" required>
        </div>

        <div class="input-container">
            <i data-lucide="phone" class="input-icon"></i>
            <input id="telephone" type="text" placeholder="Telefone" required>
        </div>

        <div class="input-container">
            <i data-lucide="lock" class="input-icon"></i>
            <input id="password" type="password" placeholder="Senha" required>
        </div>

        <button type="submit">Cadastrar</button>

    </form>

    <p class="login-link">
        Já possui conta?
        <a href="login.html">Entrar</a>
    </p>

    <footer>
        <p>&copy; 2026 Loja do mestre André. Todos os direitos reservados.</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>

    <script src="javascript/cadastro.js"></script>

</body>

</html>
